<div class="table-container">
    <table>
        <tr class="titles">
            <th>Item</th>
            <th>Description</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Total</th>
            <th></th>
        </tr>
        <tr *ngFor="let item of cartItems$ | async">
            <th><img [src]="item.imageUrl" [alt]="item.imageUrl" width="50"></th>
            <th> {{ item.description }} </th>
            <th> Rs. {{ item.price }}</th>
            <th>{{ item.quantity }}</th>
            <th>{{ item.total }}</th>
            <button class="remove-btnz" (click)="remove(item)">x</button>
        </tr>
    </table>
</div>

<div class="gotocheckout">
    <button routerLink="/checkout" class="checkout-btn">Go to checkout</button>
</div>
